<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
  <title>Document</title>
</head>
<body>
  <header><h1>Products</h1></header><br>

  <main class="container">
    <section class="product-grid">

      <article class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Wireless Headphones" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Wireless Headphones</h2>
          <p class="card-price">R300</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Bluetooth Speaker" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Bluetooth Speaker</h2>
          <p class="card-price">R350</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card">
        <img src="https://via.placeholder.com/300x200" alt="Wireless Headphones" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Keyboard</h2>
          <p class="card-price">R400</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card"> 
        <img src="https://via.placeholder.com/300x200" alt="Wireless Headphones" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Wireless Charger</h2>
          <p class="card-price">R250</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card"> 
        <img src="https://via.placeholder.com/300x200" alt="Wireless Headphones" class="card-img">
        <div class="card-body">
          <h2 class="card-title">1tb Hardrive</h2>
          <p class="card-price">R600</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>

      <article class="product-card"> 
        <img src="https://via.placeholder.com/300x200" alt="Wireless Headphones" class="card-img">
        <div class="card-body">
          <h2 class="card-title">Gaming Mouse</h2>
          <p class="card-price">R450</p>
          <button type="button" class="btn">Add to Cart</button>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
